apiVersion: batch/v1
kind: Job
metadata:
  name: clean-teacher-data
  namespace: pipeline
  labels:
    app.kubernetes.io/name: clean-teacher-data
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clean-teacher-data
    spec:
      restartPolicy: Never
      containers:
        - name: cleaner
          image: cloud-assignment-worker:local
          imagePullPolicy: Never
          command: ["python", "-m", "worker.clean"]
          env:
            - name: S3_ENDPOINT
              value: http://seaweedfs.data.svc.cluster.local:8333
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key

