apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-0
  namespace: pipeline
  labels:
    app.kubernetes.io/name: teacher-worker
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teacher-worker
        pipeline.shard-index: "0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloud-assignment-worker:local
          imagePullPolicy: Never
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: S3_ENDPOINT
              value: http://seaweedfs.data.svc.cluster.local:8333
            - name: OLLAMA_URL
              value: http://host.k3d.internal:11434/api/generate
            - name: OLLAMA_MODEL
              value: phi3.5
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
