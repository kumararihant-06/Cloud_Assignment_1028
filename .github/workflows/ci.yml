name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-training.txt
            requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-training.txt -r requirements-test.txt
      - name: Run unit and manifest tests
        run: python -m unittest discover -s tests -v
      - name: Verify selected-model quality gate
        run: python tools/score.py results/student_v2_predictions.jsonl data/validation.jsonl --out /tmp/student_v2_validation.json --min-validity 95
      - name: Verify network ACL cases
        run: python tools/nacl_sim.py network/nacl.json network/packets_sample.jsonl --check
      - name: Recalculate cost result
        run: python -m scripts.cost --out /tmp/cost.json
      - name: Build inference container
        run: docker build --file service/Dockerfile --tag cloud-assignment-service:ci .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
