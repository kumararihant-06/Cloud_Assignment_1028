apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cloud-assignment
servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "6550"
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8333:30833
    nodeFilters:
      - server:0
options:
  k3d:
    wait: true
    timeout: 180s

